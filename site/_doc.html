<!doctype html>
<html lang="en">
<head>
<!-- include: _head.html -->
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{page_title}}">
<meta property="og:description" content="{{description}}">
</head>
<body data-page="docs">
<!-- include: _header.html -->

<div class="docs-layout">
  <div class="docs-menu">
    <button type="button" aria-expanded="false" aria-controls="docs-sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      Documentation
    </button>
  </div>

  <aside class="docs-sidebar" id="docs-sidebar" aria-label="Documentation">
    <h2>Documentation</h2>
    <ul>
{{nav}}
    </ul>
    <ul class="sidebar-links">
      <li><a href="https://github.com/ao-batouche/ferryGL"><!-- include: _icon-github.html -->Source on GitHub</a></li>
      <li><a href="https://github.com/ao-batouche/ferryGL/issues"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>Report a problem</a></li>
    </ul>
  </aside>

  <main id="main" class="docs-main">
    <article class="prose">
{{content}}
    </article>
{{pager}}
    <div class="page-foot">
      <a class="edit" href="{{edit_url}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Edit this page on GitHub</a>
    </div>
  </main>

  <aside class="docs-toc" aria-label="On this page">
{{toc}}
  </aside>
</div>

<!-- include: _footer.html -->
</body>
</html>
