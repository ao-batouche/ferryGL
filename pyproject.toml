[project]
name = "ferrygl"
dynamic = ["version"]
description = "Copy your GitHub work into your own Linear workspace, from repositories you can read but don't administer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oussama Batouche" }]
keywords = ["linear", "github", "sync", "issues", "pull-requests"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Bug Tracking",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/ao-batouche/ferryGL"
Repository = "https://github.com/ao-batouche/ferryGL"
Issues = "https://github.com/ao-batouche/ferryGL/issues"

[project.scripts]
ferrygl = "ferrygl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ferrygl/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/assets", "/.github"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
